name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/slideforge
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:release -- --tag "$TAG"
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install the packed tarball in a clean project
        run: npm run test:package
      - run: npm pack --ignore-scripts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "slideforge-${TAG#v}.tgz" --draft --generate-notes --verify-tag
      - name: Publish to npm
        # Trusted publishing (OIDC) needs no secret. NPM_TOKEN is only for the first release,
        # before a trusted publisher can be configured; see CONTRIBUTING.md.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

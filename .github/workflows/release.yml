name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the Docker Hub configuration
        # Fails before npm publishing, so a missing setting cannot leave a release without its image.
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_NAMESPACE" || { echo "Set the DOCKERHUB_NAMESPACE variable" >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "Set the DOCKERHUB_USERNAME secret" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set the DOCKERHUB_TOKEN secret" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f docker/compose.yaml --profile cli build cli
      # The checkout belongs to the runner user, so the container runs as that user to write to /work.
      - name: Export the bundled example in the container
        run: >-
          docker compose -f docker/compose.yaml --profile cli run --rm --user "$(id -u):$(id -g)"
          cli export /work/examples/basic/presentation.json --output /work/presentation.pptx
      - name: Validate the exported PPTX in the container
        run: >-
          docker compose -f docker/compose.yaml --profile cli run --rm --user "$(id -u):$(id -g)"
          cli validate /work/presentation.pptx

  publish:
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/slideforge
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:release -- --tag "$TAG"
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install the packed tarball in a clean project
        run: npm run test:package
      - run: npm pack --ignore-scripts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "slideforge-${TAG#v}.tgz" --draft --generate-notes --verify-tag
      - name: Publish to npm
        # Trusted publishing: npm exchanges the workflow's OIDC token, so no secret is stored.
        run: npm publish --ignore-scripts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

  publish-container:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/slideforge
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max

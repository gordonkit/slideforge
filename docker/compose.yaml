services:
  cli:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gordonkit/slideforge:local
    volumes: ["${SLIDEFORGE_WORK:-..}:/work"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: "256m"
    security_opt: ["no-new-privileges:true"]
